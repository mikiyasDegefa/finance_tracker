name: Android build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proof of what this run actually builds.
      - name: Build context
        run: |
          git rev-parse HEAD
          grep -n "lintVital" android/build.gradle.kts || echo "NO lintVital skip in android/build.gradle.kts"
          grep -n "com.android.application" android/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle must run on the JDK setup-java installed, not a bundled JDK 17.
      - name: Use JDK 21 for Flutter
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          java -version

      # AGP's lint calls JDK 21 APIs (List.removeLast), so Gradle must not fall back to JDK 17.
      - name: Pin Gradle to the setup-java JDK
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - run: flutter pub get
      - run: flutter test

      - name: Show Gradle JVM
        run: bash android/gradlew --version

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
