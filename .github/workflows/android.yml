name: Android build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Make sure Flutter/Gradle really use JDK 21 (the lint crash needs it).
      - name: Use JDK 21 for Flutter
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          java -version

      # AGP "lintVital" crashes on some setups and is not needed to build the app.
      - name: Disable lintVital (Gradle init script)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint-vital.gradle <<'GRADLE'
          gradle.allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith("lintVital")) { t.enabled = false }
              }
          }
          GRADLE

      - run: flutter pub get
      - run: flutter test

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
